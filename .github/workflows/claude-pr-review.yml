name: Claude PR review bot (reusable)

# Reusable workflow: consuming repos invoke this from a ~15-line caller that
# carries the `on: pull_request` triggers (including `edited`, which fires when
# a stacked PR retargets its base and GitHub dismisses the standing approval)
# and the permissions block — the job below declares none of its own and runs
# with exactly what the caller grants (see the comment above its `steps:`).
# See callers/claude-pr-review.caller.yml and the README in this repo.
on:
  workflow_call:
    inputs:
      required_check:
        description: >-
          Name of the repo's CI check that runs the suite against each PR
          commit, e.g. "smoke" or "preview". Prompt context only: the review
          is told this check runs the suite, so it reviews the code on its
          merits and does not caveat about tests it cannot run or read.
          Nothing in this workflow reads the check; enforcing it is branch
          protection's job (require the check). Empty: the prompt says there
          is no designated check.
        type: string
        required: false
        default: ""
      generated_paths:
        description: >-
          Whitespace-separated git glob pattern(s) for committed generated
          data, e.g. "outputs/**" or "uv.lock". A pattern with no slash
          matches at any depth, as in .gitignore. Matching files are left out
          of the review: no diff is written for them, and the prompt lists
          them by name and size only. Empty: every changed text file is
          reviewed.
        type: string
        required: false
        default: ""
      generated_paths_note:
        description: >-
          One-sentence repo context appended to the generated-files section
          of the prompt (e.g. a pointer to the CLAUDE.md section explaining
          why the data is committed). Ignored when generated_paths is empty.
        type: string
        required: false
        default: ""
      escalate_to:
        description: >-
          Space-separated GitHub logins to request review from when the bot
          cannot supply a verdict. Empty: the escalation label is still
          applied, but nobody is requested.
        type: string
        required: false
        default: ""
      escalation_label:
        description: >-
          Label applied when a human needs to review. Create it in the repo up
          front (a missing label degrades to a warning). Pick a label no other
          automation assigns meaning to.
        type: string
        required: false
        default: "needs-human-review"
      extra_instructions:
        description: >-
          Freeform repo-specific review rules, inserted into the prompt after
          the standard review scope. This is the intended place to customize
          what the bot looks for; the reviewing rules themselves are
          deliberately not configurable.
        type: string
        required: false
        default: ""
      model:
        description: >-
          Model override passed to the action as --model (e.g.
          "claude-sonnet-5"). Empty: the action's default model.
        type: string
        required: false
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: OAuth token of the shared Claude bot account (org-level secret).
        required: true

jobs:
  claude-review:
    # Fork PRs can't access secrets/OIDC on the pull_request trigger, so the
    # review can't authenticate and the job always fails. Skip them here; forks
    # are reviewed on demand via an `@claude` comment (see claude-mention.yml)
    # instead.
    # For `edited` events, only run when the base branch changed (the payload's
    # `changes.base` is present only then) — not on title/body edits.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'edited' || github.event.changes.base != null)

    # One review per PR at a time, and only the newest push gets a verdict.
    # Without this, a burst of pushes stacks reviews and the PR accumulates
    # contradictory verdicts for superseded commits (PR #104: ten verdicts in
    # 2h09m, flip-flopping request-changes -> comment -> approve), which leaves
    # the author unable to tell which one is current. Cancelling in progress is
    # why the verify step below must guard on `!cancelled()`.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    runs-on: ubuntu-latest
    # No `permissions:` here, on purpose: the job inherits the caller's grant.
    # A called workflow can only keep or reduce what its caller passes, so a
    # permission listed here is a hard requirement on every caller, checked at
    # STARTUP — before any step, before the `if:` above. On 2026-09-21 this
    # block gained `actions: read` for a CI cross-check that has since been
    # removed (README changelog, 2026-09-30), and every caller without that
    # line (this repo's own selftest included) stopped at
    # "is requesting 'actions: read', but is only allowed 'actions: none'". A
    # startup failure creates no check, no label and no escalation, so the
    # review silently vanished from those PRs until 2026-09-29 — and where the
    # check was required, the PR could not merge at all
    # (Deco354/factory-farm-em#17; the README changelog has the story).
    #
    # The least-privilege block lives in callers/claude-pr-review.caller.yml.
    # What each permission is for:
    #   contents: read       — checkout
    #   pull-requests: write — the verdict, inline comments, review requests
    #   issues: write        — the escalation label
    #   id-token: write      — the action's OIDC exchange for its app token
    # `actions: read` is not used by anything here any more (it served the
    # removed cross-check); a caller that still carries the line is harmless.
    # The review's own token cannot read checks at all (statusCheckRollup
    # needs the Checks permission, which claude-code-action cannot request),
    # which is why the prompt tells it not to try — see "Compose review prompt".

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 2, not 1: on pull_request this checks out GitHub's merge commit,
          # and "Write per-file diffs" diffs it against its first parent (the
          # base). Depth 2 fetches both parents and nothing older.
          fetch-depth: 2

      # The action reports the job as successful the moment the agent process
      # ends, even when it posted no verdict (see the verify step at the end).
      # Record a start time so that step can require a *fresh* verdict — backdated
      # 60s to absorb runner/GitHub clock skew, and to exclude any stale review
      # left at the same head SHA by a previous run (e.g. after a base retarget).
      - name: Record review start time
        id: review-start
        run: echo "ts=$(date -u -d '60 seconds ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # The review cannot see a large PR's diff through `gh pr diff`. The
      # whole diff reaches the agent as ONE tool result, and above Claude
      # Code's tool-output limit it gets only "Output too large (150.9KB).
      # Full output saved to: …" plus a 2 KB preview. `gh pr diff` takes no
      # path argument, so it cannot ask for one file instead. On
      # Deco354/factory-farm-em#29 (2026-10-06..08, 25 files, ~150 KB of
      # diff) all seven runs tried a per-file diff, were refused ("accepts at
      # most 1 arg(s)"), never opened the saved file, read one to three
      # files and approved — while `analysis/summary.py`, which computes the
      # PR's headline numbers, went unread (issue #11). So the diff is split
      # here, one file per changed path under .claude-review/diffs/, which
      # the Read tool opens and pages like any other file. The tool
      # allowlist is unchanged.
      #
      # git rather than splitting `gh pr diff`: no API call, and no ceiling —
      # GitHub's diff endpoint refuses very large PRs, and the pipeline
      # repo's `outputs/**` PRs are the large ones. generated_paths become
      # exclude pathspecs, so a generated file never gets a diff to read.
      - name: Write per-file diffs
        id: diffs
        env:
          GENERATED_PATHS: ${{ inputs.generated_paths }}
        run: |
          set -euo pipefail
          # actions/checkout on pull_request checks out the merge commit, whose
          # first parent is the base: HEAD^1..HEAD is exactly what merging
          # would change. Any other checkout has no base to diff against here.
          if ! git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            echo "::error::HEAD is not the pull_request merge commit, so there is no base to diff against. The caller must trigger on pull_request (see callers/claude-pr-review.caller.yml)."
            exit 1
          fi
          out="${GITHUB_WORKSPACE}/.claude-review"
          state="${RUNNER_TEMP}/claude-review"
          rm -rf "$out" "$state"
          mkdir -p "$out/diffs" "$state"

          # generated_paths -> git glob pathspecs. `read -a`, not an unquoted
          # $GENERATED_PATHS, so `outputs/**` is never expanded against the
          # checkout. A pattern with no slash matches at any depth, as in
          # .gitignore: `uv.lock` also matches `pkg/uv.lock`.
          read -r -a pats <<<"${GENERATED_PATHS}"
          gen=()
          for p in "${pats[@]}"; do
            gen+=(":(glob)${p}")
            case "$p" in */*) ;; *) gen+=(":(glob)**/${p}") ;; esac
          done
          excl=()
          for g in "${gen[@]}"; do excl+=(":(exclude,${g#:(}"); done

          # `git diff --numstat -z` record: "added<TAB>deleted<TAB>path"; for a
          # rename the path is empty and the old and new paths follow as two
          # more NUL-terminated fields. Binary files count "-".
          split() {
            add="${1%%$'\t'*}"; local rest="${1#*$'\t'}"
            del="${rest%%$'\t'*}"; path="${rest#*$'\t'}"
          }

          : >"$state/generated.md"
          if [ "${#gen[@]}" -gt 0 ]; then
            while IFS= read -r -d '' rec; do
              split "$rec"
              printf -- "- \`%s\` (+%s/-%s)\n" "$path" "$add" "$del" >>"$state/generated.md"
            done < <(git diff --no-renames --numstat -z HEAD^1 HEAD -- "${gen[@]}")
          fi

          n=0
          : >"$state/manifest.jsonl"; : >"$state/files.md"; : >"$state/binary.md"
          git diff -M --numstat -z HEAD^1 HEAD -- . "${excl[@]}" >"$state/numstat"
          while IFS= read -r -d '' rec; do
            split "$rec"
            from=""
            if [ -z "$path" ]; then
              IFS= read -r -d '' from
              IFS= read -r -d '' path
            fi
            if [ "$add" = "-" ]; then
              printf -- "- \`%s\`\n" "$path" >>"$state/binary.md"
              continue
            fi
            diff="$out/diffs/${path}.diff"
            mkdir -p "$(dirname "$diff")"
            git --literal-pathspecs diff -M HEAD^1 HEAD -- ${from:+"$from"} "$path" >"$diff"
            lines=$(( $(wc -l <"$diff") ))
            n=$((n + 1))
            jq -nc --arg p "$path" --arg d "$diff" --argjson l "$lines" \
              '{path: $p, diff: $d, lines: $l}' >>"$state/manifest.jsonl"
            label="+${add}/-${del}, ${lines} diff lines"
            if [ -n "$from" ]; then label="renamed from \`${from}\`, ${label}"; fi
            printf -- "- \`%s\` (%s): \`%s\`\n" "$path" "$label" "$diff" >>"$state/files.md"
          done <"$state/numstat"

          echo "${n} diff(s) to review:"; cat "$state/files.md"
          if [ -s "$state/generated.md" ]; then echo "Generated, not reviewed:"; cat "$state/generated.md"; fi
          if [ -s "$state/binary.md" ]; then echo "Binary, no text diff:"; cat "$state/binary.md"; fi
          echo "count=${n}" >>"$GITHUB_OUTPUT"
          echo "state=${state}" >>"$GITHUB_OUTPUT"

      # The review prompt is assembled here, not inline in the action's
      # `with:`, so callers can swap the repo-specific sections through
      # workflow_call inputs without touching the reviewing rules themselves.
      # Inputs enter via env and are spliced with bash string substitution —
      # never expression-interpolated into the script body — so an input
      # value cannot inject into this script. Verbatim prompt blocks use
      # QUOTED heredocs ('BLOCK') so the prompt's backticks and $(...)
      # examples are never executed here.
      - name: Compose review prompt
        id: prompt
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REQUIRED_CHECK: ${{ inputs.required_check }}
          GENERATED_PATHS: ${{ inputs.generated_paths }}
          GENERATED_PATHS_NOTE: ${{ inputs.generated_paths_note }}
          EXTRA_INSTRUCTIONS: ${{ inputs.extra_instructions }}
          DIFF_COUNT: ${{ steps.diffs.outputs.count }}
          STATE: ${{ steps.diffs.outputs.state }}
        run: |
          # Bash 5.2 turns an unquoted `&` in a ${T//pat/rep} replacement into
          # the matched text; a note or file name containing `&` must survive.
          shopt -u patsub_replacement 2>/dev/null || true
          P="$(mktemp)"

          printf 'REPO: %s\nPR NUMBER: %s\n\n' "$REPO" "$PR_NUMBER" >>"$P"

          # The diff is NOT read through `gh pr diff` any more — see "Write
          # per-file diffs" for why. The list of diff files is the review's
          # scope, and "every diff, to its last line" is measured afterwards
          # (see "Measure which diffs the review read").
          #
          # Read-all-first, and naming tests/docs/configs as in scope, are
          # from Deco354/factory-farm-em#40 (2026-10-08, 2 runs). There, with
          # "Read EVERY diff" but "focus on … the changed code only" and
          # "you do not need [the tests]" further down, Sonnet 5.5 read the
          # source diffs a few at a time, most important first. It skipped
          # all 6 test files and both docs, 12 of 24 diffs in each run, then
          # approved and said it had read them.
          cat >>"$P" <<'BLOCK'
          Review this pull request. The PR branch is already checked out in
          the current working directory, and the diff of each changed file
          is saved as its own file, listed below. Read the diffs with the
          Read tool. Do not run `gh pr diff`: on a large PR its output is too
          long to be shown to you and arrives as a 2 KB preview. To read
          other files, use the Read, Grep, and Glob tools — do NOT use git,
          cat, sed, grep, or find via Bash: only the `gh pr` subcommands
          below are permitted, and any other Bash command is denied and just
          wastes turns.
          BLOCK

          if [ "$DIFF_COUNT" -gt 0 ]; then
            read -r -d '' T <<'BLOCK' || true
          Changed files (__COUNT__). Start by reading EVERY diff below, each
          one to its last line — not a sample, and not only the files that
          look riskiest. Issue those Read calls together, in one turn if you
          can. Tests, docs, and config files are part of the review, not
          just source code: a test can assert the wrong behaviour, a config
          can set a wrong value, and a doc can promise something the code
          does not do. Read returns 2,000 lines at a time by default: for a
          longer diff, call it again with `offset` and `limit` until you
          reach the end. Only then read the surrounding source wherever a
          hunk needs context.
          BLOCK
            T="${T//__COUNT__/${DIFF_COUNT}}"
            printf '\n%s\n\n' "$T" >>"$P"
            cat "$STATE/files.md" >>"$P"
          else
            printf '\n%s\n' "This PR changes no non-generated text files, so there is no diff to read." >>"$P"
          fi

          if [ -s "$STATE/generated.md" ]; then
            read -r -d '' T <<'BLOCK' || true
          These changed files match the repository's generated-data patterns
          (`__PATHS__`) — machine-written output, not hand-authored code.__NOTE__
          They are not part of your review and no diff is saved for them:
          name them with their line counts in your summary and move on.
          BLOCK
            note=""
            if [ -n "$GENERATED_PATHS_NOTE" ]; then note=" ${GENERATED_PATHS_NOTE}"; fi
            T="${T//__PATHS__/${GENERATED_PATHS}}"
            T="${T//__NOTE__/${note}}"
            printf '\n%s\n\n' "$T" >>"$P"
            cat "$STATE/generated.md" >>"$P"
          fi

          if [ -s "$STATE/binary.md" ]; then
            printf '\n%s\n\n' "Binary files changed (no text diff to read):" >>"$P"
            cat "$STATE/binary.md" >>"$P"
          fi

          cat >>"$P" <<'BLOCK'

          Report only high-signal problems in the changed files (this bar is
          for what you report, not for what you read):
          - Bugs, logic errors, and unhandled edge cases
          - Security issues
          - Clear violations of guidelines in any relevant CLAUDE.md (root or a
            CLAUDE.md in a parent directory of the changed file)

          Skip nitpicks, style preferences, and pre-existing issues.
          BLOCK

          if [ -n "$EXTRA_INSTRUCTIONS" ]; then
            printf '\n%s\n' "$EXTRA_INSTRUCTIONS" >>"$P"
          fi

          # The prompt deliberately does NOT ask the review to read CI. It
          # cannot: `statusCheckRollup` is served by the Checks permission,
          # which claude-code-action cannot request (`additional_permissions`
          # accepts only `actions: read`), and `gh pr checks` is not in the
          # tool allowlist. It used to try anyway and burn turns on a denied
          # call — see Deco354/fragile-compassion#15, where it reported
          # "Resource not accessible by integration" and reviewed blind.
          #
          # Test results are enforced by branch protection (require the CI
          # check), not by this workflow. A post-approval cross-check of the
          # verdict against `required_check` lived in the verify step from
          # 2026-09-21 to 2026-09-30 and was removed: it gated nothing (the
          # README says not to require this check), could only see a suite
          # that finished before the review did, and spent runner minutes
          # waiting on the ones that did not (README changelog). The block
          # below is what keeps the 2026-09-17..21 caveats from returning:
          # it must keep telling the review plainly not to read CI and not
          # to caveat.
          if [ -n "$REQUIRED_CHECK" ]; then
            read -r -d '' T <<'BLOCK' || true
          You cannot run tests and you cannot read CI results — do not try,
          the calls are denied and will only waste turns. You do not need
          the results: this repository's `__CHECK__` check runs the suite
          against this commit, and its result is enforced by the repository's
          branch rules independently of your review. Review the code on its
          merits and do not caveat your review over not having seen test
          results. That is about results only: the test files in the diff
          are part of your review, like every other diff.
          BLOCK
            T="${T//__CHECK__/${REQUIRED_CHECK}}"
          else
            read -r -d '' T <<'BLOCK' || true
          You cannot run tests and you cannot read CI results — do not try,
          the calls are denied and will only waste turns. This repository
          has no designated check anyway. That is still never a reason to
          avoid a verdict: review the code on its merits.
          BLOCK
          fi
          T="${T//__PR__/${PR_NUMBER}}"
          printf '\n%s\n' "$T" >>"$P"

          read -r -d '' T <<'BLOCK' || true
          Leave feedback with `mcp__github_inline_comment__create_inline_comment`
          for each specific issue (one comment per issue, on the relevant line).

          Then submit exactly ONE formal review verdict for PR
          #__PR__. First write your summary
          to a file named `review-body.md` in the repository root using the
          Write tool (this keeps the command below free of shell quoting).

          Your verdict MUST agree with your own summary. Before running the
          command, re-read what you wrote:
          - If your summary says the changes are correct, that you found no
            bugs / security issues / CLAUDE.md violations, or describes what
            you found as "minor", "not blocking", "not a blocker", "a nit",
            or "worth a follow-up" — that is an APPROVAL. Approve.
          - If your summary says something should be fixed "before merge",
            calls anything a "real bug", or gives the author an imperative
            ("either wire a consumer or fix the comment") — that is a CHANGE
            REQUEST. Request changes.
          - Do NOT write a summary that states one verdict and then file a
            different one. A finding you are unwilling to block on is an
            approval with a note, not a neutral review.

          "Significant" means it would produce wrong output, corrupt or
          delete data, leak a secret, cost money unexpectedly, break a
          documented interface, or violate an explicit CLAUDE.md
          requirement. Anything else is not significant.

          Run ONE of these — nothing else:
          - Significant issues found:
            `gh pr review __PR__ --request-changes --body-file review-body.md`
          - Correct, no significant issues:
            `gh pr review __PR__ --approve --body-file review-body.md`
          - The decision is not yours to make even in principle — a product,
            research, or cost/quality tradeoff, or a public-facing breaking
            change needing an owner's sign-off:
            `gh pr review __PR__ --comment --body-file review-body.md`
            If you use this, the body MUST open with the single specific
            question a human has to answer. This verdict fails the review
            check and requests review from a maintainer, so never reach for
            it to avoid choosing.
          Always use `--body-file`; never pass the summary inline with
          `--body "..."`. Do NOT use command substitution `$(...)`, pipes, or
          heredocs in any command — they are blocked in this environment and
          the command will silently fail to run. Never merge the PR; a human
          decides whether to merge.
          BLOCK
          T="${T//__PR__/${PR_NUMBER}}"
          printf '\n%s\n' "$T" >>"$P"

          delim="PROMPT_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "prompt<<${delim}"
            cat "$P"
            echo "${delim}"
          } >>"$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Print the full SDK stream into the job log. Without this, a turn-1
          # auth failure is undiagnosable from CI: the action logs only redacted
          # init/result events (no error text), a debug-mode rerun adds nothing,
          # and no artifact is uploaded — while any PR editing this workflow
          # makes the action self-skip, so the setting must already be on main
          # before a failure happens. The stream contains only what the review
          # agent says and runs; the OAuth token itself is masked by Actions.
          show_full_output: true
          # Also review commits pushed by bots (e.g. a fix pushed by claude[bot]).
          # Without this the action rejects bot-initiated runs. Narrow to specific
          # bot names instead of '*' if you want to restrict which bots trigger it.
          allowed_bots: "*"
          prompt: ${{ steps.prompt.outputs.prompt }}
          # The action denies comment-posting tools by default; grant the inline
          # comment tool plus the gh subcommands the review needs, or it reviews
          # but cannot post its findings. `Write` lets the review compose its
          # summary into review-body.md for `gh pr review --body-file` — a plain
          # `--body "..."` carrying a multi-line or command-substituted string is
          # blocked in headless CI (it isn't covered by the Bash allow-rule and
          # can't be interactively approved). Write grants runner-wide write,
          # acceptable here: the job is `contents: read`, ephemeral, and the PR
          # checkout is already treated as untrusted.
          #
          # --disallowedTools "Task": the review agent can spawn parallel
          # sub-agents (Task tool) to split up a large diff. Task's default
          # background execution assumes an interactive harness that resumes
          # the model when a sub-agent finishes; this action runs one
          # non-interactive turn with no such resume, so the model's turn just
          # ends while sub-agents are still running mid-review (PR #73: the
          # action exited "success" after the model said "Waiting for the
          # three background review agents to finish before continuing" and
          # never posted a verdict). Blocking Task keeps the review
          # single-threaded and synchronous end-to-end.
          # `Bash(gh pr comment:*)` was dropped: the verdict body is the
          # summary channel, and across nine high-traffic PRs the review had
          # never once posted a plain comment. Keeping it only offered a
          # weaker exit than the three verdicts.
          claude_args: |
            --allowedTools "Write,mcp__github_inline_comment__create_inline_comment,Bash(gh pr review:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --disallowedTools "Task"
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # Did the review read every diff? The prompt asks it to, but the agent
      # decides, so measure it from the execution file rather than trusting
      # the summary: a diff counts as read only when the agent's successful
      # Read calls covered every one of its lines. Read returns 2,000 lines
      # per call unless given offset/limit, and a #29 run read lines 1-80 of
      # a 461-line file and moved on. Report-only by decision (issue #11,
      # 2026-10-08: tying the verdict to coverage would block too many PRs):
      # this never fails the check or touches the verdict. It decides whether
      # the follow-up pass below runs, and "Report review coverage" re-counts
      # over both passes. continue-on-error keeps that true if this script
      # itself breaks (an execution file jq cannot parse, say): the follow-up
      # and the report then skip, and the verdict is checked as usual.
      - name: Measure which diffs the review read
        id: coverage
        if: >-
          always() && !cancelled() &&
          steps.claude-review.outcome == 'success' &&
          steps.claude-review.outputs.execution_file != '' &&
          steps.diffs.outputs.count != '0'
        continue-on-error: true
        env:
          STATE: ${{ steps.diffs.outputs.state }}
          EXEC_FILE: ${{ steps.claude-review.outputs.execution_file }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          shopt -u patsub_replacement 2>/dev/null || true
          # The follow-up pass writes its execution file to the same path, so
          # keep this pass's copy for the count over both passes.
          cp "$EXEC_FILE" "$STATE/exec-1.json"

          cat >"$STATE/coverage.jq" <<'JQ'
          # Input (-s): one execution file per review pass, each an array of
          # SDK messages. $m: the manifest, one {path, diff, lines} per diff.
          # Output: the manifest with `read` set on every entry.
          def covers($n):  # input: [[first, last], ...] line ranges read
            ($n == 0) or
            (reduce sort[] as $r (0; if $r[0] <= . + 1 then ([., $r[1]] | max) else . end) >= $n);
          (add // []) as $msgs
          | [ $msgs[] | select(.type == "user") | .message.content[]?
              | select(.type == "tool_result" and (.is_error // false)) | .tool_use_id ] as $failed
          | [ $msgs[] | select(.type == "assistant") | .message.content[]?
              | select(.type == "tool_use" and .name == "Read")
              | select(.id as $id | any($failed[]; . == $id) | not)
              | (.input.file_path // "") as $f
              | ([(.input.offset // 1 | tonumber), 1] | max) as $first
              | { file: (if ($f | startswith("/")) then $f else "\(env.GITHUB_WORKSPACE)/\($f)" end),
                  range: [$first, $first + (.input.limit // 2000 | tonumber) - 1] } ] as $reads
          | $m | map(. as $e | . + { read: ([ $reads[] | select(.file == $e.diff) | .range ] | covers($e.lines)) })
          JQ

          jq -s --slurpfile m "$STATE/manifest.jsonl" -f "$STATE/coverage.jq" \
            "$STATE/exec-1.json" >"$STATE/coverage.json"
          total=$(jq length "$STATE/coverage.json")
          unread=$(jq '[.[] | select(.read | not)] | length' "$STATE/coverage.json")
          echo "unread=${unread}" >>"$GITHUB_OUTPUT"
          echo "The review read $((total - unread)) of ${total} diffs to the end."
          if [ "$unread" -eq 0 ]; then
            exit 0
          fi
          list=$(jq -r '.[] | select(.read | not) | "- `\(.path)`: `\(.diff)` (\(.lines) lines)"' "$STATE/coverage.json")
          echo "$list"

          read -r -d '' T <<'BLOCK' || true
          A check of your Read calls found that your review of PR #__PR__ did
          not read these diffs to the end:

          __LIST__

          Read each of them now, every line, with the Read tool (2,000 lines
          at a time by default; use `offset` and `limit` to page through a
          longer one), plus any surrounding source a hunk needs. Leave an
          inline comment for each specific issue, as before.

          Then submit exactly ONE more verdict, for the whole PR: what you
          reviewed before plus these files, under the same rules as before.
          Write the summary to `review-body.md` first, and say in it which
          files this pass added. Run ONE of these — nothing else:
          - Significant issues found anywhere in the PR:
            `gh pr review __PR__ --request-changes --body-file review-body.md`
          - Correct, no significant issues:
            `gh pr review __PR__ --approve --body-file review-body.md`
          - The decision is not yours to make even in principle, as before:
            `gh pr review __PR__ --comment --body-file review-body.md`
          BLOCK
          T="${T//__PR__/${PR_NUMBER}}"
          T="${T//__LIST__/${list}}"
          delim="PROMPT_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "followup_prompt<<${delim}"
            printf '%s\n' "$T"
            echo "${delim}"
          } >>"$GITHUB_OUTPUT"

      # A second pass, only when the first left diffs unread. It resumes the
      # same session — the action's `session_id` output "can be used with
      # --resume to continue this conversation" — so the agent keeps what it
      # already read and its first verdict in context, and is asked to
      # finish. Its verdict is then the latest bodied claude review, which
      # the verify step below already checks, unchanged.
      #
      # Why not post an `@claude` comment and let the mention handler do it:
      # a comment made with the job's GITHUB_TOKEN starts no workflow
      # (GitHub's recursion guard), and the review agent deliberately has no
      # comment tool. continue-on-error: a follow-up that fails must not take
      # the first pass's verdict down with it; "Report review coverage" says
      # what is still unread.
      #
      # `with:` mirrors "Run Claude Code Review". Keep the two claude_args
      # allowlists identical — the comments on the first explain each entry.
      - name: Review the diffs the first pass did not read
        id: claude-followup
        if: >-
          always() && !cancelled() &&
          steps.coverage.outcome == 'success' &&
          steps.coverage.outputs.unread != '' &&
          steps.coverage.outputs.unread != '0' &&
          steps.claude-review.outputs.session_id != ''
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          allowed_bots: "*"
          prompt: ${{ steps.coverage.outputs.followup_prompt }}
          claude_args: |
            --resume ${{ steps.claude-review.outputs.session_id }}
            --allowedTools "Write,mcp__github_inline_comment__create_inline_comment,Bash(gh pr review:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --disallowedTools "Task"
            ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }}

      # Report-only, like the measurement: what the review read over both
      # passes, in the job summary. When diffs are still unread — the
      # follow-up missed them, failed, or had no session to resume — it also
      # says so on the PR, where the author will see it, with a ready-to-paste
      # `@claude` prompt modelled on the one that reviewed #29's unread files
      # (2026-10-08) and found a bug seven approvals had missed. The comment
      # is posted with the job's own token, so its `@claude` text starts
      # nothing; a human pastes it. Never fails the check.
      - name: Report review coverage
        if: always() && !cancelled() && steps.coverage.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.diffs.outputs.state }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FOLLOWUP_OUTCOME: ${{ steps.claude-followup.outcome }}
          FOLLOWUP_EXEC: ${{ steps.claude-followup.outputs.execution_file }}
        run: |
          execs=("$STATE/exec-1.json")
          if [ "$FOLLOWUP_OUTCOME" != "skipped" ] && [ -n "$FOLLOWUP_EXEC" ] && [ -f "$FOLLOWUP_EXEC" ]; then
            execs+=("$FOLLOWUP_EXEC")
          fi
          if ! jq -s --slurpfile m "$STATE/manifest.jsonl" -f "$STATE/coverage.jq" \
               "${execs[@]}" >"$STATE/coverage.json"; then
            echo "::warning::Could not count the review's coverage over both passes; see \"Measure which diffs the review read\" for the first pass."
            exit 0
          fi
          total=$(jq length "$STATE/coverage.json")
          unread=$(jq '[.[] | select(.read | not)] | length' "$STATE/coverage.json")
          case "$FOLLOWUP_OUTCOME" in
            success) passes=" over two passes" ;;
            failure) passes=" (the follow-up pass failed)" ;;
            *)       passes="" ;;
          esac
          {
            echo "### Review coverage"
            echo
            echo "Read **$((total - unread)) of ${total}** non-generated diffs to the end${passes}."
            if [ "$unread" -gt 0 ]; then
              echo
              echo "Not read:"
              jq -r '.[] | select(.read | not) | "- `\(.path)`"' "$STATE/coverage.json"
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "$unread" -eq 0 ]; then
            echo "✓ The review read all ${total} non-generated diffs${passes}."
            exit 0
          fi

          echo "::warning::The review did not read ${unread} of ${total} non-generated diffs to the end${passes}, so its verdict does not cover them. A comment on the PR names them, with an @claude prompt to review them."
          short="${HEAD_SHA:0:7}"
          names=$(jq -r '[.[] | select(.read | not) | "`\(.path)`"] | join(", ")' "$STATE/coverage.json")
          body="$STATE/coverage-warning.md"
          {
            echo "> [!WARNING]"
            echo "> **The automated review of ${short} did not read ${unread} of ${total} changed files**, so its verdict does not cover them:"
            jq -r '.[] | select(.read | not) | "> - `\(.path)`"' "$STATE/coverage.json"
            echo
            echo "To have Claude review them, post this as a new comment:"
            echo
            echo '```'
            echo "@claude Please review these files in this PR, which the automated review of ${short} did not read: ${names}."
            echo
            echo "**This is a review only. Don't push commits or edit files.** Reply on this PR with your findings. For each one, give the \`file:line\`, a concrete input or state that produces a wrong result, and why it's wrong. Then list what you read in full."
            echo '```'
          } >"$body"
          if gh api -X POST "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
               -F "body=@${body}" >/dev/null; then
            echo "✓ Posted the coverage warning on the PR."
          else
            echo "::warning::Could not post the coverage warning on the PR; the job summary still lists the files."
          fi

      # Turn the action's false-green into a hard failure: confirm a claude[bot]
      # review for THIS head commit was submitted during this run, and fail the
      # check loudly if not (the action exposes no "verdict posted" signal). A
      # read of the reviews API only needs the default token's pull-requests read.
      #
      # This step also decides the check's colour from the verdict's *state*. A
      # neutral (COMMENTED) verdict supplies zero of the one approval `main`
      # requires, so it leaves the PR unmergeable — but it used to leave this
      # check green, which is how PR #82 sat for 17 days with two green checks,
      # a body opening "Real bug found:", and nothing for the author to click.
      # Neutral now fails the check and escalates (see the next step).
      #
      # `!cancelled()` matters: `always()` fires on cancelled jobs too, and the
      # job-level concurrency above cancels superseded runs. Without the guard a
      # cancelled run would report a missing verdict and escalate spuriously.
      - name: Verify a review verdict was posted
        id: verdict
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ESCALATION_LABEL: ${{ inputs.escalation_label }}
          SINCE: ${{ steps.review-start.outputs.ts }}
          ACTION_OUTCOME: ${{ steps.claude-review.outcome }}
          EXEC_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          # Only enforce when the action actually ran a review. The action
          # self-skips — exiting "success" with no execution output — when it
          # cannot run, most commonly on a PR that edits this workflow or its
          # caller (the action requires the file to match the default branch). That is not a
          # review failure. The original bug is distinguishable: there the action
          # ran to completion (an execution_file exists) but posted no verdict.
          if [ "${ACTION_OUTCOME}" != "success" ]; then
            echo "::notice::Claude action outcome was '${ACTION_OUTCOME}'; the job status already reflects that. Skipping verdict check."
            exit 0
          fi
          if [ -z "${EXEC_FILE}" ]; then
            # A self-skip means this PR got NO automated review at all. The check
            # deliberately stays green (663c7e2: a red X the author cannot act on
            # is noise), but staying silent is what made this indistinguishable
            # from a reviewed PR: on the PR page a self-skip reads as a fast
            # green `claude-review`, and a guard-skipped no-op re-run after a
            # real review reads as `skipping`. Neither tells you whether anyone
            # looked. So record it as a verdict state and let the escalation step
            # label the PR and request a human — the same routing a neutral
            # verdict gets, for the same reason: a human has to do the reviewing.
            echo "verdict=NOT_REVIEWED" >> "$GITHUB_OUTPUT"
            echo "::warning::This PR received no automated review — the action self-skipped, which happens when a PR edits the review workflow or its caller (the action only runs the workflow copy on the default branch). Requesting a human reviewer instead."
            exit 0
          fi
          if [ -z "${SINCE}" ]; then
            echo "::error::No start timestamp was recorded; cannot verify the review."
            exit 1
          fi
          # Poll briefly for API read-after-write consistency. submitted_at is
          # ISO-8601 UTC, so the >= string compare against SINCE is correct.
          #
          # `(.body|length) > 0` is load-bearing, not defensive. Every inline
          # comment the review posts also lands in this endpoint as its own
          # review object with an EMPTY body and state COMMENTED — 152 of the
          # 351 claude reviews on PRs #59-#118 are these artifacts. Reading
          # `.state` without the body filter would classify almost every
          # review, including approvals, as neutral. Take the LAST bodied
          # review: that is the formal verdict.
          #
          # Pages are merged by `jq -s 'add'` BEFORE filtering. `gh api
          # --paginate --jq` applies the filter to each page separately, so
          # `last` would run per page and the substitution would join each
          # page's own answer — making `$verdict` a multi-line string that
          # matches no `case` arm below, so a real verdict would be reported as
          # "posted no verdict" and the check would fail on a healthy review.
          # Needs >100 review objects on one PR (`--paginate` requests
          # per_page=100); the busiest so far, #65, has 48, so this is
          # headroom rather than a live failure — but every inline comment adds
          # a review object, so a long-iterated PR gets there. `--slurp` cannot
          # be used: gh rejects it when combined with `--jq`. This matches the
          # idiom claude-review-fix.yml already uses in four places.
          for attempt in 1 2 3 4 5 6; do
            verdict=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews" --paginate \
              | jq -r -s 'add // [] | [.[] | select(.commit_id==env.HEAD_SHA and .submitted_at>=env.SINCE and (.user.login|test("claude";"i")) and (.body|length) > 0)] | last | .state // ""')
            if [ -n "${verdict}" ]; then
              break
            fi
            echo "No verdict yet (attempt ${attempt}/6); waiting…"
            sleep 10
          done
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          case "${verdict}" in
            APPROVED|CHANGES_REQUESTED)
              echo "✓ Claude submitted a ${verdict} verdict for ${HEAD_SHA}."

              # Clear a stale escalation from an earlier neutral verdict on this
              # PR; the bot has since committed to a binary call. 404 when the
              # label isn't present is the normal case, hence the discard.
              gh api -X DELETE \
                "repos/${{ github.repository }}/issues/${PR_NUMBER}/labels/$(printf %s "${ESCALATION_LABEL}" | jq -sRr @uri)" \
                >/dev/null 2>&1 || true
              exit 0
              ;;
            COMMENTED)
              echo "::error::Claude reached no binary verdict for ${HEAD_SHA} — it neither approved nor requested changes, so this PR cannot merge on its own. The review body names the question a human has to answer; the next step requests that review."
              exit 1
              ;;
            DISMISSED)
              # A human dismissed the verdict (the 5 dismissed change-requests in
              # the history all carry hand-written dismissal messages). They are
              # already engaged, so don't fail the check or page anyone — just say
              # plainly that the review no longer counts toward the approval gate.
              echo "::notice::Claude's verdict for ${HEAD_SHA} was dismissed by a human, so it no longer counts toward the required approval. Nothing to re-run; a human is already handling this PR."
              exit 0
              ;;
          esac
          echo "::error::Claude review ran but posted no verdict for ${HEAD_SHA}. Re-run the workflow to retry."
          # Surface *why* inline instead of forcing a trawl through the
          # show_full_output stream (thousands of lines): the execution file's
          # final "result" turn carries Claude's own last message plus how the
          # turn ended, which is exactly what showed PR #73's stall was Claude
          # itself saying "Waiting for the three background review agents to
          # finish before continuing" and then stopping.
          echo "::group::Claude's last turn (likely cause)"
          jq -r '
            (map(select(.type=="result")) | last) as $r
            | if $r then
                "stop subtype: \($r.subtype // "unknown")",
                "stop_reason: \($r.stop_reason // "unknown")",
                "is_error: \($r.is_error // false)",
                "num_turns: \($r.num_turns // "unknown")",
                "final message from Claude:",
                ($r.result // "(none — the run likely errored before completing a turn)")
              else
                "No \"result\" turn found in the execution output; the run likely crashed mid-stream. Check the \"Run Claude Code Review\" step log."
              end
          ' "${EXEC_FILE}" 2>/dev/null || echo "Could not parse ${EXEC_FILE} as JSON; check the \"Run Claude Code Review\" step log instead."
          echo "::endgroup::"
          exit 1

      # Two states need a human, and neither used to say so anywhere the author
      # would see it:
      #
      #   COMMENTED    - the reviewer looked but wouldn't commit to a verdict. A
      #                  comment-only review neither blocks nor unblocks, so it
      #                  sat inert with nobody notified.
      #   NOT_REVIEWED - the action self-skipped (a PR edited this workflow or
      #                  its caller), so nothing was reviewed at all.
      #                  This reads on the PR page as a fast green `claude-review`
      #                  and is therefore worse: it looks like a pass.
      #
      # Both route the same way, because the remedy is the same — a human has to
      # review this PR. The check's colour is left alone in both cases (a neutral
      # verdict fails it, a self-skip does not, per 663c7e2); this step is about
      # making the state visible on the PR itself rather than only in a run log.
      #
      # The label name comes from the `escalation_label` input (default
      # `needs-human-review`). Pick a label no other automation assigns meaning
      # to: in the repo this was extracted from, reusing the auto-fixer's
      # `needs-human` stop label would have permanently disarmed automated
      # fixes for every escalated PR.
      - name: Request human review when the bot cannot supply one
        if: >-
          always() && !cancelled() &&
          (steps.verdict.outputs.verdict == 'COMMENTED' ||
           steps.verdict.outputs.verdict == 'NOT_REVIEWED')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          VERDICT: ${{ steps.verdict.outputs.verdict }}
          # Maintainers who adjudicate judgment calls: space-separated logins
          # from the caller's `escalate_to` input; empty means label-only.
          ESCALATE_TO: ${{ inputs.escalate_to }}
          ESCALATION_LABEL: ${{ inputs.escalation_label }}
        run: |
          case "${VERDICT}" in
            NOT_REVIEWED) why="no automated review ran on this PR (the action self-skipped)" ;;
            *)            why="the automated review reached no binary verdict" ;;
          esac
          echo "Escalating: ${why}."

          # Skip maintainers who already have a pending request. This matters more
          # than it used to: NOT_REVIEWED fires on every push to a PR that edits
          # this workflow or its caller, so without deduping a long-running
          # workflow PR would re-POST the same reviewers on each push. (The
          # origin repo's stall sweep deduped for the same reason.)
          pending=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/requested_reviewers" \
            --jq '[.users[].login] | join(" ")' 2>/dev/null || echo "")

          # GitHub also rejects a request naming the PR's own author (422), so
          # drop them too — that is why this is a list and not one name.
          reviewers=""
          for login in ${ESCALATE_TO}; do
            if [ "${login}" = "${PR_AUTHOR}" ]; then
              continue
            fi
            case " ${pending} " in
              *" ${login} "*) continue ;;
            esac
            reviewers="${reviewers} ${login}"
          done
          reviewers="$(echo "${reviewers}" | tr -s ' ' | sed 's/^ //;s/ $//')"

          gh api -X POST "repos/${{ github.repository }}/issues/${PR_NUMBER}/labels" \
            -f "labels[]=${ESCALATION_LABEL}" >/dev/null 2>&1 \
            && echo "✓ Labeled ${ESCALATION_LABEL}." \
            || echo "::warning::Could not apply the ${ESCALATION_LABEL} label."

          if [ -z "${reviewers}" ]; then
            if [ -n "${pending}" ]; then
              echo "✓ ${why}; review already pending from ${pending}, so nothing to re-request."
            else
              echo "::warning::${why}, but there is no eligible reviewer to request (no maintainers are configured via escalate_to, or the PR author is the only one). The ${ESCALATION_LABEL} label is the only signal."
            fi
            exit 0
          fi
          # Re-requesting an already-pending reviewer is a harmless no-op, which
          # matters because this workflow re-runs on every push.
          args=""
          for login in ${reviewers}; do
            args="${args} -f reviewers[]=${login}"
          done
          # shellcheck disable=SC2086
          if gh api -X POST "repos/${{ github.repository }}/pulls/${PR_NUMBER}/requested_reviewers" ${args} >/dev/null 2>&1; then
            echo "✓ Requested review from: ${reviewers} (${why})"
          else
            echo "::warning::Could not request review from ${reviewers}; the ${ESCALATION_LABEL} label still stands."
          fi

